bundle:
  name: retail-lakehouse

include:
  - resources/*.yml

# The job runs the package as a wheel (no sys.path tricks, same code as the tests)
artifacts:
  lakehouse_wheel:
    type: whl
    path: .
    build: python -m pip wheel . --no-deps -w dist

variables:
  catalog:
    description: Unity Catalog catalog for all tables and volumes
    default: workspace
  schema:
    description: Schema that holds bronze, silver and gold tables
    default: retail

targets:
  # Personal copy: resources are prefixed with the user name and schedules stay paused
  dev:
    mode: development
    default: true

  # Shared deployment: schedule active, separate schema, failure e-mails
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: retail_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
