[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_lakehouse"
version = "0.1.0"
description = "Retail sell-out lakehouse on Databricks: medallion layers, SCD2 and data quality on Delta Lake"
requires-python = ">=3.10"

# Entry points used by the Databricks job (python_wheel_task)
[project.scripts]
lakehouse-bronze = "lakehouse.jobs:bronze_main"
lakehouse-silver = "lakehouse.jobs:silver_main"
lakehouse-gold = "lakehouse.jobs:gold_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["delta: needs the Delta Lake jars (set RUN_DELTA_TESTS=1)"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks get spark, dbutils and display injected at runtime
"notebooks/*.py" = ["F821", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["lakehouse"]
