# Daily job: bronze -> silver -> gold on serverless compute.
# Every task is safe to retry: Auto Loader and the silver stream keep checkpoints,
# silver MERGEs are guarded, gold rebuilds a fixed window with replaceWhere.
# In the dev target the schedule is paused automatically.
resources:
  jobs:
    retail_sales_daily:
      name: retail-sales-daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"
        timezone_id: America/Sao_Paulo
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: lookback_days
          default: "7"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: retail_lakehouse
            entry_point: lakehouse-bronze
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--run-id"
              - "{{job.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          python_wheel_task:
            package_name: retail_lakehouse
            entry_point: lakehouse-silver
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--run-id"
              - "{{job.run_id}}"
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          python_wheel_task:
            package_name: retail_lakehouse
            entry_point: lakehouse-gold
            parameters:
              - "--catalog"
              - "{{job.parameters.catalog}}"
              - "--schema"
              - "{{job.parameters.schema}}"
              - "--run-id"
              - "{{job.run_id}}"
              - "--lookback-days"
              - "{{job.parameters.lookback_days}}"
          max_retries: 1
          min_retry_interval_millis: 60000
