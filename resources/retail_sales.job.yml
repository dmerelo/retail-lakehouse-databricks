# Daily job: bronze -> silver -> gold on serverless compute (no cluster block needed).
# Every task is safe to retry: Auto Loader and the silver stream keep checkpoints,
# silver MERGEs are guarded, gold rebuilds a fixed window with replaceWhere.
resources:
  jobs:
    retail_sales_daily:
      name: retail-sales-daily
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 5 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver.py
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold.py
            base_parameters:
              lookback_days: "7"
          max_retries: 1
          min_retry_interval_millis: 60000
